[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-sdk"
version = "2.0.0a2"
description = "Auditable, budget-aware verification and diagnostics for RAG systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Abhijay Gupta"}
]
keywords = ["rag", "evaluation", "llm", "hallucination", "conflict-detection", "position-bias"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=2.7.0",
]
hhem = [
    "transformers>=4.41.0,<5.0.0",
    "torch>=2.1.0",
    "sentencepiece>=0.1.99",
]
google = [
    "google-genai>=1.0.0",
]
benchmark = [
    "ragas>=0.4.1,<0.5.0",
    "langchain-community>=0.3.31,<0.4.0",
    "datasets>=2.14.0",
    "matplotlib>=3.7.0",
    "openai>=1.0.0",
    "psutil>=5.9.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
rag-eval = "rag_eval_sdk.cli:main"
rag-eval-ragtruth = "benchmarks.ragtruth_benchmark:main"
rag-eval-rgb = "benchmarks.rgb_official:main"
rag-eval-spans = "benchmarks.span_evaluation:main"

[project.urls]
Homepage = "https://github.com/NightSlayer0002/RAG-eval-SDK"

[tool.setuptools.packages.find]
include = ["rag_eval_sdk*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
